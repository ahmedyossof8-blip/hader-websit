# fly.toml app configuration file generated for hader-websit on 2026-10-29T18:55:14Z
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = 'hader-websit'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  grace_period = '10s'
  interval = '15s'
  method = 'GET'
  path = '/health'
  protocol = 'http'
  timeout = '5s'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024